<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <!-- BRAND -->
    <div class="brand">
      <div class="brand-mark">
        <mat-icon>hub</mat-icon>
      </div>

      <div class="brand-text">
        <span class="brand-title">Employee</span>
        <span class="brand-subtitle">HUB</span>
      </div>
    </div>

    <!-- NAVIGATION -->
    <div class="navigation">
      <div class="nav-section-title">WORKSPACE</div>

      <a
        routerLink="/employees"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a routerLink="/employees/add" routerLinkActive="active" class="nav-item">
        <mat-icon>person_add</mat-icon>
        <span>Add Employee</span>
      </a>

      <a routerLink="/employees/upload" routerLinkActive="active" class="nav-item">
        <mat-icon>upload_file</mat-icon>
        <span>Bulk Upload</span>
      </a>

      <div class="nav-section-title second">SYSTEM</div>

      <a class="nav-item">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </a>
    </div>

    <!-- CONNECTION -->
    <div class="sidebar-footer">
      <div class="connection-status">
        <span class="status-dot"></span>

        <div>
          <strong>GraphQL</strong>
          <small>Connected</small>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="breadcrumb-area">
        <button mat-icon-button class="mobile-menu-button">
          <mat-icon>menu</mat-icon>
        </button>

        <div>
          <span class="eyebrow"> EMPLOYEE MANAGEMENT </span>

          <h1>Employee Hub</h1>
        </div>
      </div>

      <!-- TOP RIGHT -->
      <div class="topbar-actions">
        <button mat-icon-button matTooltip="Notifications">
          <mat-icon> notifications_none </mat-icon>
        </button>

        <div class="divider"></div>

        <!-- USER -->
        <div class="user-profile">
          <div class="avatar">S</div>

          <div class="user-info">
            <strong> Sipu </strong>

            <span> Administrator </span>
          </div>

          <button mat-icon-button matTooltip="Logout" class="logout-button" (click)="logout()">
            <mat-icon> logout </mat-icon>
          </button>
        </div>
      </div>
    </header>

    <!-- PAGE -->
    <section class="page-content">
      <router-outlet />
    </section>
  </main>
</div>
