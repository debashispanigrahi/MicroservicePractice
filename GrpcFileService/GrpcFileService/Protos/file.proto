syntax = "proto3";

option csharp_namespace = "GrpcFileService";

package file;

service FileService {
  rpc UploadFile (UploadFileRequest) returns (UploadFileResponse);
}

message UploadFileRequest {
  string file_name = 1;
  bytes file_content = 2;
}

message UploadFileResponse {
  bool success = 1;
  string message = 2;
}