name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  dotnet:
    name: .NET - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - EmployeeGraphQLApi/EmployeeGraphQLApi.slnx
          - GrpcFileService/GrpcFileService.slnx
          - GrpcFileUploader/GrpcFileUploader.slnx
          - WebSocketEmployeeApi/WebSocketEmployeeApi.slnx

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore "${{ matrix.project }}"
      - name: Build
        run: dotnet build "${{ matrix.project }}" --no-restore --configuration Release

  angular:
    name: Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: employee-portal-ui

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: employee-portal-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
